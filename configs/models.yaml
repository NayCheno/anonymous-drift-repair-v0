retriever:
  type: keyword
  version: deterministic_v0.1
  top_k: 3
  corpus_path: data/toy_corpus.jsonl
  preprocessing:
    lowercase: True
    strip_punctuation: True
    split: whitespace
  chunking:
    strategy: record_as_chunk
    max_tokens: null
    overlap_tokens: 0
  index:
